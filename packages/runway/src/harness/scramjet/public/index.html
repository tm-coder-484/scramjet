<!doctype html>
<html>
	<head>
		<title>Scramjet Test Harness</title>
		<script src="/scramjet/scramjet.js"></script>
		<script src="/controller/controller.api.js"></script>
		<script src="/libcurl/index.js"></script>
		<script src="/runway-cleartext-https-transport.js"></script>
	</head>
	<body>
		<h1>Scramjet Test Harness</h1>
		<div id="status">Initializing...</div>
		<button id="reload-btn" style="display: none; margin: 8px 0">
			🔄 Reload Test
		</button>
		<iframe
			id="testframe"
			style="width: 100%; height: 80vh; border: 1px solid #ccc"
		></iframe>

		<script>
			const statusEl = document.getElementById("status");
			const testframe = document.getElementById("testframe");
			const reloadBtn = document.getElementById("reload-btn");
			const { Controller } = $scramjetController;
			const LibcurlClient = window.LibcurlTransport.LibcurlClient;

			let controller;
			let scramjetFrame;

			// RUNWAY_CONTROLLER_WORKER=1 (see harness/scramjet/index.ts) opens this page with ?worker:
			// the controller runs in a worker and builds its transport there
			const workerMode = new URLSearchParams(location.search).has("worker");

			// worker mode: the per-test globals runway sets on this page (cleartext site and host
			// lists) are forwarded to the worker over this channel. each message carries all of
			// them and is acked, so a navigation can wait until the worker has applied them.
			const CLEARTEXT_GLOBALS = [
				"__runwayCleartextSite",
				"__runwayCleartextHttpsHosts",
				"__runwayCleartextHttps",
			];
			const cleartextState = {};
			let cleartextSeq = 0;
			let cleartextAckedSeq = 0;
			let cleartextWaiters = [];
			let cleartextPost = null;
			if (workerMode) {
				const wire = new BroadcastChannel("runway-cleartext");
				wire.onmessage = (e) => {
					if (e.data?.kind !== "runway-cleartext-ack") return;
					cleartextAckedSeq = Math.max(cleartextAckedSeq, e.data.seq);
					cleartextWaiters = cleartextWaiters.filter((w) => {
						if (w.seq > cleartextAckedSeq) return true;
						w.resolve();
						return false;
					});
				};
				cleartextPost = () => {
					const seq = ++cleartextSeq;
					wire.postMessage({
						kind: "runway-cleartext",
						seq,
						globals: { ...cleartextState },
					});
					return seq;
				};
				for (const name of CLEARTEXT_GLOBALS) {
					Object.defineProperty(window, name, {
						configurable: true,
						get: () => cleartextState[name],
						set: (value) => {
							cleartextState[name] = value;
							cleartextPost();
						},
					});
				}
			}
			// resolves once the worker has applied every cleartext global set so far
			function cleartextSynced() {
				const seq = cleartextPost();
				return new Promise((resolve, reject) => {
					const timer = setTimeout(
						() =>
							reject(
								new Error(
									"controller worker did not apply the cleartext settings"
								)
							),
						10000
					);
					cleartextWaiters.push({
						seq,
						resolve: () => {
							clearTimeout(timer);
							resolve();
						},
					});
				});
			}

			// the controller worker runs this (its source is sent there), so it can only use what
			// the worker has: the libcurl and cleartext scripts it imported, and globalThis
			function runwayWorkerTransport() {
				const wire = new BroadcastChannel("runway-cleartext");
				wire.onmessage = (e) => {
					if (e.data?.kind !== "runway-cleartext") return;
					Object.assign(globalThis, e.data.globals);
					wire.postMessage({ kind: "runway-cleartext-ack", seq: e.data.seq });
				};
				return new RunwayCleartextHttpsTransport(
					new LibcurlTransport.LibcurlClient({
						wisp: "ws://localhost:4501/",
					})
				);
			}

			async function init() {
				statusEl.textContent = "Registering service worker...";

				const registration = await navigator.serviceWorker.register("/sw.js");

				// Wait for the service worker to be ready
				if (!navigator.serviceWorker.controller) {
					statusEl.textContent = "Waiting for service worker to activate...";
					await new Promise((resolve) => {
						if (registration.active) {
							resolve();
							return;
						}
						const sw = registration.installing || registration.waiting;
						if (sw) {
							sw.addEventListener("statechange", () => {
								if (sw.state === "activated") resolve();
							});
						}
					});
					// Wait for controller
					if (!navigator.serviceWorker.controller) {
						await new Promise((resolve) => {
							navigator.serviceWorker.addEventListener(
								"controllerchange",
								resolve,
								{ once: true }
							);
						});
					}
				}

				statusEl.textContent = "Initializing controller...";

				const sw = navigator.serviceWorker.controller ?? registration.active;
				if (!sw) {
					throw new Error("No service worker available for controller");
				}

				const scramjetConfig = {
					// every RTCPeerConnection relays through the harness's TURN server
					webrtcRelay: [
						{
							urls: "turn:127.0.0.1:4503?transport=tcp",
							username: "runway",
							credential: "runway",
						},
					],
					// the rewrite cache is off for /nocache/ paths (tests/adversarial/modules.ts)
					siteFlags: { "/nocache/": { rewriteCache: false } },
				};

				if (workerMode) {
					// the transport is built inside the controller worker; the per-test globals
					// reach it over the cleartext channel (see sync below)
					controller = new Controller({
						serviceworker: sw,
						worker: {
							scripts: [
								"/libcurl/index.js",
								"/runway-cleartext-https-transport.js",
							],
							transport: runwayWorkerTransport,
						},
						scramjetConfig,
					});
				} else {
					const innerTransport = new LibcurlClient({
						wisp: "ws://localhost:4501/",
					});
					const transport = new RunwayCleartextHttpsTransport(innerTransport);
					controller = new Controller({
						serviceworker: sw,
						transport,
						scramjetConfig,
					});
				}
				window.__runwayController = controller;

				await controller.ready;

				scramjetFrame = controller.createFrame(testframe);
				window.__runwayScramjetFrame = scramjetFrame;

				statusEl.textContent = "Ready - waiting for test...";

				window.__runwayNavigate = (url) => {
					statusEl.textContent = `Loading test: ${url}`;
					// Store the URL for reload support
					sessionStorage.setItem("__runway_last_test", url);
					reloadBtn.style.display = "inline-block";
					// injectTestFunctions();
					console.log("navigating to", url);
					if (workerMode) {
						cleartextSynced()
							.then(() => scramjetFrame.go(url))
							.catch((err) => console.error("navigation not started:", err));
						return;
					}
					scramjetFrame.go(url);
				};

				window.__runwayGetProxiedUrl = (url) => {
					const rewrite = () =>
						$scramjet.rewriteUrl(url, scramjetFrame.context, {
							origin: new URL(location.href),
							base: new URL(location.href),
						});
					// the test may fetch the result right away, so the worker must have its settings
					return workerMode ? cleartextSynced().then(rewrite) : rewrite();
				};

				window.__runwayReload = () => {
					const lastTest = sessionStorage.getItem("__runway_last_test");
					if (lastTest) {
						window.__runwayNavigate(lastTest);
					}
				};

				reloadBtn.addEventListener("click", window.__runwayReload);

				// Auto-navigate to last test on reload
				const lastTest = sessionStorage.getItem("__runway_last_test");
				if (lastTest) {
					console.log("Reloading last test:", lastTest);
					window.__runwayNavigate(lastTest);
				}

				console.log("Harness ready, __runwayNavigate exposed");
			}

			init().catch((err) => {
				statusEl.textContent = `Error: ${err.message}`;
				console.error("Harness init error:", err);
			});
		</script>
	</body>
</html>
